
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q source.zip -d project

      - name: Install App Icon
        run: |
          unzip -oq RxGame-Icon-Assets.zip -d project/RxGameAndroid/app/src/main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/RxGameAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RxGame-debug-apk
          path: project/RxGameAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
